# Local PostgreSQL for development only: `docker compose up -d`.
# The credentials match .env.example; never use them for a real deployment.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - harbour-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  harbour-db:
